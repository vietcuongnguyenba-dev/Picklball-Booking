<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Sân Pickleball Công Ty</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-emerald-400">🏸 Đặt Sân Pickleball Công Ty</h1>
            <p class="text-sm text-slate-400">Bấm vào ô để đặt sân hoặc tham gia ghép nhóm (Tối đa 8 người/ca)</p>
        </header>

        <!-- Form nhập thông tin nhanh -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="text" id="name" placeholder="Họ và tên" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
            <input type="text" id="cardId" placeholder="Số thẻ nhân viên" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
            <button onclick="saveUserInfo()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-sm transition">Lưu thông tin</button>
        </div>

        <!-- Chú thích màu -->
        <div class="flex flex-wrap gap-4 text-xs text-slate-300 bg-slate-900/50 p-3 rounded-lg border border-slate-800/80 justify-center">
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-emerald-600 rounded"></span> Trống</div>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-amber-600 rounded"></span> Có thể ghép (&lt;8 người)</div>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-rose-600 rounded"></span> Đã đầy (Đủ 8 người)</div>
            <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-blue-600 rounded"></span> Ca của bạn</div>
        </div>

        <!-- Trạng thái tải -->
        <div id="loading-status" class="text-center text-xs text-amber-400 font-medium hidden">
            ⏳ Đang đồng bộ dữ liệu...
        </div>

        <!-- Lịch đặt sân (7 ngày tới) -->
        <div id="schedule-container" class="space-y-4">
            <!-- Render bằng JavaScript -->
        </div>

        <!-- Khu vực Quản trị (Admin) -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center cursor-pointer" onclick="toggleAdminPanel()">
                <h3 class="font-bold text-sm text-slate-300 flex items-center gap-2">⚙️ Quản trị hệ thống</h3>
                <span id="admin-toggle-icon" class="text-xs text-slate-500">Bấm để mở</span>
            </div>
            
            <div id="admin-content" class="hidden space-y-3 pt-2 border-t border-slate-800">
                <div class="flex gap-2">
                    <input type="password" id="adminPinInput" placeholder="Nhập mã PIN admin" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-sm flex-1 focus:outline-none">
                    <button onclick="verifyAdmin()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-1.5 rounded-lg text-sm transition">Đăng nhập</button>
                </div>

                <div id="admin-controls" class="hidden space-y-3 pt-2">
                    <p class="text-xs text-emerald-400">✓ Đã đăng nhập quyền Admin thành công (PIN: 15102026)</p>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="clearAllBookings()" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 border border-rose-700 px-3 py-1.5 rounded-lg text-xs transition">Xóa toàn bộ lịch đặt sân</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxao0YBNUpciNO0gWtRwC96d1zraAV1XOiwko7794cbONVHYaX4mVWBSJaVOdqnGvni8A/exec'; 

        const DEFAULT_ADMIN_PIN = '15102026';

        const SESSIONS = [
            { id: 'morning', name: 'Buổi sáng (5h00 - 7h30)' },
            { id: 'afternoon1', name: 'Chiều 1 (16h30 - 18h30)' },
            { id: 'afternoon2', name: 'Chiều 2 (18h30 - 21h00)' }
        ];

        let bookingsData = {};

        window.onload = function() {
            if(localStorage.getItem('pb_name')) document.getElementById('name').value = localStorage.getItem('pb_name');
            if(localStorage.getItem('pb_card')) document.getElementById('cardId').value = localStorage.getItem('pb_card');
            
            if(!localStorage.getItem('pb_admin_pin')) {
                localStorage.setItem('pb_admin_pin', DEFAULT_ADMIN_PIN);
            }
            
            fetchBookings();
        };

        function saveUserInfo() {
            const name = document.getElementById('name').value.trim();
            const card = document.getElementById('cardId').value.trim();
            if(!name || !card) {
                alert('Vui lòng nhập đầy đủ Họ tên và Số thẻ!');
                return;
            }
            localStorage.setItem('pb_name', name);
            localStorage.setItem('pb_card', card);
            alert('Đã lưu thông tin! Từ giờ bạn chỉ cần bấm vào ca muốn đặt.');
            renderSchedule();
        }

        function showLoading(show) {
            const el = document.getElementById('loading-status');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        async function fetchBookings() {
            showLoading(true);
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error('Lỗi truy cập dữ liệu');
                bookingsData = await response.json();
                renderSchedule();
            } catch (e) {
                alert('Không thể kết nối Google Sheets: ' + e.message);
            } finally {
                showLoading(false);
            }
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            
            const myCard = localStorage.getItem('pb_card') || '';

            for (let i = 0; i < 7; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                const displayDate = `Thứ ${['Chủ Nhật', 'Hai', 'Ba', 'Tư', 'Năm', 'Sáu', 'Bảy'][d.getDay()]} (${d.getDate()}/${d.getMonth()+1})`;

                let dayHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                        <h3 class="font-bold text-emerald-400 text-sm border-b border-slate-800 pb-2">${displayDate}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                `;

                SESSIONS.forEach(ses => {
                    const slotKey = `${dateStr}_${ses.id}`;
                    const players = bookingsData[slotKey] || [];
                    const count = players.length;
                    const isMyBooking = players.some(p => p.card === myCard);

                    let bgCardClass = 'bg-emerald-950/40 border-emerald-800/60 hover:border-emerald-500'; 
                    let statusText = 'Còn trống (Bấm để đặt)';
                    
                    if (isMyBooking) {
                        bgCardClass = 'bg-blue-950/60 border-blue-600'; 
                        statusText = `Ca của bạn (${count}/8 người)`;
                    } else if (count >= 8) {
                        bgCardClass = 'bg-rose-950/40 border-rose-800/60 opacity-80'; 
                        statusText = `Đã đầy (${count}/8 người)`;
                    } else if (count > 0) {
                        bgCardClass = 'bg-amber-950/40 border-amber-600 hover:border-amber-400'; 
                        statusText = `Có thể ghép (${count}/8 người)`;
                    }

                    dayHTML += `
                        <div onclick="handleSlotClick('${dateStr}', '${ses.id}')" class="cursor-pointer border rounded-lg p-3 transition space-y-2 ${bgCardClass}">
                            <div class="flex justify-between items-center text-xs font-semibold text-slate-300">
                                <span>${ses.name}</span>
                                <span class="px-2 py-0.5 rounded bg-slate-800 text-[10px]">${count}/8</span>
                            </div>
                            <div class="text-xs text-slate-400">${statusText}</div>
                            <div class="text-[11px] text-slate-300 space-y-0.5">
                                ${players.map(p => `<div>• ${p.name} (${p.card})</div>`).join('')}
                            </div>
                        </div>
                    `;
                });

                dayHTML += `</div></div>`;
                container.innerHTML += dayHTML;
            }
        }

        async function handleSlotClick(date, sessionId) {
            const name = localStorage.getItem('pb_name');
            const card = localStorage.getItem('pb_card');
            
            if(!name || !card) {
                alert('Vui lòng nhập Họ tên và Số thẻ nhân viên ở ô trên trước khi đặt sân!');
                window.scrollTo({top: 0, behavior: 'smooth'});
                return;
            }

            const slotKey = `${date}_${sessionId}`;
            let players = bookingsData[slotKey] || [];
            
            const existingIndex = players.findIndex(p => p.card === card);

            if (existingIndex !== -1) {
                if(confirm('Bạn có muốn hủy đăng ký / rời khỏi ca này không?')) {
                    players.splice(existingIndex, 1);
                } else {
                    return;
                }
            } else {
                if (players.length >= 8) {
                    alert('Ca này đã đủ 8 người, không thể tham gia thêm!');
                    return;
                }
                players.push({ name, card });
            }

            showLoading(true);

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slot_key: slotKey, players: players })
                });

                bookingsData[slotKey] = players;
                renderSchedule();
                
                setTimeout(fetchBookings, 1000);
            } catch (e) {
                alert('Lỗi khi gửi dữ liệu: ' + e.message);
                showLoading(false);
            }
        }

        function toggleAdminPanel() {
            const content = document.getElementById('admin-content');
            content.classList.toggle('hidden');
        }

        function verifyAdmin() {
            const pin = document.getElementById('adminPinInput').value.trim();
            const savedPin = localStorage.getItem('pb_admin_pin') || DEFAULT_ADMIN_PIN;
            
            if(pin === savedPin) {
                document.getElementById('admin-controls').classList.remove('hidden');
                alert('Đăng nhập quản trị thành công!');
            } else {
                alert('Mã PIN không chính xác!');
            }
        }

        async function clearAllBookings() {
            if(confirm('CẢNH BÁO: Thao tác này sẽ xóa toàn bộ lịch đặt sân trên Google Sheets. Tiếp tục?')) {
                showLoading(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'clear_all' })
                    });

                    alert('Đã gửi yêu cầu làm sạch toàn bộ lịch!');
                    setTimeout(fetchBookings, 1000);
                } catch (e) {
                    alert('Lỗi khi xóa: ' + e.message);
                    showLoading(false);
                }
            }
        }
    </script>
</body>
</html>
